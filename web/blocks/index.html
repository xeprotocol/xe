<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>blocks · xe</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header id="xe-header"></header>
  <nav id="xe-subnav" class="nav-secondary"></nav>

  <main>
    <header class="page-head">
      <h1 id="page-title">blocks</h1>
      <span class="page-sub" id="page-sub" hidden></span>
    </header>

    <div class="error" id="error" role="alert" aria-live="assertive" hidden></div>

    <section class="section-card" id="list-section" hidden>
      <h2>recent blocks <span class="hint" id="list-count"></span></h2>
      <table>
        <thead><tr>
          <th data-sort="time">time</th>
          <th data-sort="type">type</th>
          <th data-sort="account">account</th>
          <th data-sort="asset">asset</th>
          <th data-sort="amount" class="num">amount</th>
          <th data-sort="balance" class="num">balance</th>
          <th data-sort="hash">hash</th>
        </tr></thead>
        <tbody id="list-tbody"><tr><td colspan="7" class="muted">loading…</td></tr></tbody>
      </table>
    </section>

    <section class="detail section-card" id="detail-section" hidden>
      <h2>block <span class="hint" id="block-type"></span></h2>
      <dl id="fields" class="kv"></dl>
    </section>

    <section class="raw section-card" id="raw-section" hidden>
      <h2>raw</h2>
      <pre id="raw"></pre>
    </section>
  </main>

  <script type="module" src="/assets/nav.js"></script>
  <script type="module" src="/assets/block.js"></script>
</body>
</html>
