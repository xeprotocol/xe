<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>peers · xe</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header id="xe-header"></header>
  <nav id="xe-subnav" class="nav-secondary"></nav>

  <main>
    <header class="page-head">
      <h1 id="page-title">peers</h1>
      <span class="page-sub" id="page-sub" hidden></span>
    </header>

    <div class="error" id="error" role="alert" aria-live="assertive" hidden></div>

    <section class="section-card">
      <h2>this node</h2>
      <dl class="kv" id="self-kv"></dl>
    </section>

    <section class="section-card">
      <h2>connected peers <span class="hint" id="list-count"></span></h2>
      <table>
        <thead><tr>
          <th data-sort="id">peer id</th>
          <th data-sort="address">address</th>
          <th data-sort="version">version</th>
          <th data-sort="connected">connected</th>
        </tr></thead>
        <tbody id="list-tbody"><tr><td colspan="4" class="muted">loading…</td></tr></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="/assets/nav.js"></script>
  <script type="module" src="/assets/peers.js"></script>
</body>
</html>
