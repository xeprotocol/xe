global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    network: xe-testnet

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: xe-node
    metrics_path: /metrics
    static_configs:
      - targets: ["ldn:9095"]
        labels: { node: ldn }
      - targets: ["ffm:9095"]
        labels: { node: ffm }
      - targets: ["nyc:9095"]
        labels: { node: nyc }
      - targets: ["p1:9095"]
        labels: { node: p1 }
      - targets: ["p2:9095"]
        labels: { node: p2 }

  - job_name: node-exporter
    static_configs:
      - targets: ["ldn:9100", "ffm:9100", "nyc:9100", "p1:9100", "p2:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
