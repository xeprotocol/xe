# Monitoring stack for the xe network (#841).
#
#   docker compose -f deploy/monitoring/compose.yml up -d
#
# Brings up Prometheus (:9090), Alertmanager (:9093) and Grafana (:3000) with
# the datasource and dashboard provisioned, so the stack is reproducible from
# this repository rather than living only on one box. The previous arrangement
# was uncommitted, on a single host, with an ingress stanza that a wipe nearly
# destroyed — if that box had died the setup was unrecoverable.
#
# Edit prometheus.yml with the real node addresses before starting. Set
# GF_SECURITY_ADMIN_PASSWORD; do not ship the default.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle

  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
